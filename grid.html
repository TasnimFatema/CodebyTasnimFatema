<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-practice</title>
</head>
<body>
    <div><div style="
        display: grid;
        grid-template-columns: 200px 75px;
        "><div style="background-color: lightblue;
        ">200px</div>
        <div style="background-color: pink;
        ">75px</div></div>
        


    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 100px 200px 100px;
        ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightblue;">200px</div>
        <div style="background-color: lightblue;">100px</div>
    </div>
        

        <div style="
           display: grid;
           grid-template-columns: 50px 50px 50px;"> <div style="background-color: pink;margin-top: 20px;margin-right: 10px;">col1</div>
          <div style="background-color: lightblue;margin-top: 20px;margin-right: 10px;">col2</div>
          <div style="background-color: pink;margin-top: 20px;margin-right: 10px;">col3</div>
          <div style="background-color: lightblue;margin-top: 20px;margin-right: 10px;">col4</div>
          <div style="background-color: pink;margin-top: 20px;margin-right: 10px;">col5</div>
          <div style="background-color: lightblue;margin-top: 20px;margin-right: 10px;">col6</div>
      </div>
    </div>
    
       


</body>
</html>
