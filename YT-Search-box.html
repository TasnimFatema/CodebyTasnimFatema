<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytSearch-box</title>
    <style>
        .Searchbox{
            font-size: 15px;
            border-radius: 5px;
            border-width: 1px;
            height: 40px;
            width: 200px;
            margin-bottom: 20px;

        }
        .Google {
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 12px;
            padding-bottom: 12px;
            box-shadow: 5px;
            width: 400px;
            height: 30px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
            font-size: 16px;
            margin-top:10px;
            margin-right: 20px;
            margin-left: 20px;
        }

    </style>
</head>
<body>
    <input class="Searchbox" type="text" placeholder="Search">
    <input class="Google" type="text" placeholder="Search Google or type a URL">
</body>
</html>
